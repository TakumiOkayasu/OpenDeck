[build-system]
requires = ["scikit-build-core==1.1.1", "pybind11==3.1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "opendeck-n4pro"
version = "0.1.0"
description = "Configurable, device-independent operations for Mirabox N4 Pro"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = []

[project.optional-dependencies]
device = [
    "pillow",
    "pyudev; sys_platform == 'linux'",
    "wmi; sys_platform == 'win32'",
    "pywin32; sys_platform == 'win32'",
]

[project.scripts]
opendeck = "opendeck.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "native/**/*" },
]

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["src/opendeck"]
sdist.include = ["CMakeLists.txt", "native/**"]
sdist.exclude = ["vendor/**"]

[tool.scikit-build.cmake.define]
BUILD_TESTING = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
exclude = [".venv", "vendor"]
# Excluded SDK files should not emit diagnostics even when opened in the editor.
ignore = ["vendor"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py314"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
