[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opendeck-n4pro"
version = "0.1.0"
description = "Configurable, device-independent operations for Mirabox N4 Pro"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = []

[project.optional-dependencies]
device = [
    "pillow",
    "pyudev; sys_platform == 'linux'",
    "wmi; sys_platform == 'win32'",
    "pywin32; sys_platform == 'win32'",
]

[project.scripts]
opendeck = "opendeck.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/opendeck"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src", "tests", "docs", "examples", "README.md", "LICENSE",
    "pyproject.toml", "uv.lock", ".python-version",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
exclude = [".venv", "vendor"]
# Excluded SDK files should not emit diagnostics even when opened in the editor.
ignore = ["vendor"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py314"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
