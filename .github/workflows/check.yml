name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: "2026.11.2"
          install_args: "--locked"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.7"
          python-version: "3.15"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run opendeck --help
      - name: Check clangd compilation database
        shell: bash
        run: |
          uv run python tools/configure_clangd.py
          clangd --check=native/src/runtime.cpp
          clangd --check=native/python/module.cpp
          clangd --check=native/tests/contracts.cpp
      - name: Build and test the standalone C++ core
        run: |
          cmake -S . -B build/core -DOPENDECK_BUILD_PYTHON=OFF -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/core --config Debug --parallel 2
          ctest --test-dir build/core -C Debug --output-on-failure
      - name: Build source and wheel distributions
        run: uv build
      - name: Verify the sdist and install the wheel in isolation
        shell: bash
        run: |
          uv run --no-project python - <<'PY'
          import os
          import subprocess
          import tarfile
          import tempfile
          from pathlib import Path

          root = Path.cwd()
          sdist, = (root / "dist").glob("*.tar.gz")
          with tarfile.open(sdist) as archive:
              names = {name.partition("/")[2] for name in archive.getnames()}
          required = {
              "CMakeLists.txt",
              "native/include/opendeck/contracts.hpp",
              "native/include/opendeck/model.hpp",
              "native/include/opendeck/runtime.hpp",
              "native/private/opendeck/panel.hpp",
              "native/private/opendeck/recognition.hpp",
              "native/private/opendeck/source.hpp",
              "native/src/runtime.cpp",
              "native/src/recognition.cpp",
              "native/src/panel.cpp",
              "native/python/module.cpp",
              "native/tests/contracts.cpp",
              "native/tests/older_standard.cpp",
              "native/tests/mixed_consumer/CMakeLists.txt",
              "native/tests/mixed_consumer/main.cpp",
              "native/tests/mixed_consumer/helper.c",
          }
          assert required <= names, required - names
          assert not any(name.startswith("vendor/") for name in names)

          wheel, = (root / "dist").glob("*.whl")
          environment = root / "build" / "wheel-env"
          subprocess.run(["uv", "venv", str(environment)], check=True)
          python = environment / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
          subprocess.run(
              ["uv", "pip", "install", "--python", str(python), str(wheel)],
              check=True,
          )
          with tempfile.TemporaryDirectory(prefix="opendeck-wheel-") as outside:
              subprocess.run(
                  [str(python), "-I", "-c", "import opendeck; import opendeck._native"],
                  cwd=outside,
                  check=True,
              )
              subprocess.run(
                  [str(python), "-I", "-m", "opendeck", "--help"],
                  cwd=outside,
                  check=True,
              )
          PY
